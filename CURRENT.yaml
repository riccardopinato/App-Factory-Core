factory_version: 2
repository: riccardopinato/App-Factory-Core
updated_at: 2026-10-09

master:
  version: "25.1"
  status: CURRENT
  path: master/MASTER_PROMPT_CURRENT.txt
  versioned_path: master/MASTER_PROMPT_UTILITY_FLUTTER_CHATGPT_v25_1_FULL.txt

golden_index:
  version: 10
  status: CURRENT
  path: golden/GOLDEN_INDEX_CURRENT.txt
  versioned_path: golden/GOLDEN_COMPONENTS_INDEX_v10.txt

golden_registry:
  version: 2
  path: golden/GOLDEN_REGISTRY.yaml

bootstrap:
  path: bootstrap/APP_FACTORY_BOOTSTRAP.txt

validation:
  version: 2
  script: scripts/validate_factory.py
