name: Sync v27 Master after semantic policy changes
on:
  push:
    branches:
      - 'feat/semantic-*'
    paths:
      - 'v27/candidate/MASTER_CORE_v27_CANDIDATE.txt'
      - 'master/MASTER_PROMPT_CURRENT.txt'
      - 'v27/candidate/MODULE_MAP.json'
      - '.github/workflows/sync-v27-semantic.yml'

permissions:
  contents: write

concurrency:
  group: semantic-v27-sync-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Regenerate full fallback from canonical v27 modular source
        run: |
          python3 scripts/build_v27_fallback.py --write
          python3 scripts/build_v27_fallback.py --check
          python3 -m unittest discover -s tests -p 'test_semantic_qa_engine.py' -v
      - name: Commit only synchronized fallback and hash manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v27/candidate/MODULE_MAP.json v27/candidate/MASTER_FULL_FALLBACK_GENERATED.txt
          if ! git diff --cached --quiet; then
            git commit -m 'build(factory): synchronize v27 full fallback and hashes for semantic QA'
            git push origin HEAD:refs/heads/${{ github.ref_name }}
          fi
