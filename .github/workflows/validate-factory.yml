name: Validate App Factory Core

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r scripts/requirements.txt

      - name: Validate Factory resolver, registry and supply chain
        run: python3 scripts/validate_factory.py

      - name: Check reusable passports and scoped donor source gate
        run: |
          python3 scripts/reuse_passport_gate.py --check
          python3 -m unittest discover -s tests -p 'reuse_passport_test.py' -v

      - name: Validate harvested engine contracts and portable fixture definitions
        run: python3 scripts/validate_engine_harvest.py

      - name: Verify Template Engine Standard v1 manifest contract and fail-closed vectors
        run: |
          python3 scripts/validate_template_engine_v1.py
          python3 -m unittest discover -s tests -p 'test_template_engine_v1.py' -v

      - name: Validate v27 section coverage and synchronized fallback
        run: python3 scripts/validate_v27_candidate.py --self-test

      - name: Verify generated Master navigation legend and 27-item ownership
        run: python3 scripts/build_master_legend.py --check

      - name: Check synchronized full fallback and modular hashes
        run: python3 scripts/build_v27_fallback.py --check

      - name: Validate generated command legend and public command registry
        run: |
          python3 scripts/build_command_legend.py --check
          python3 scripts/test_command_legend.py
          python3 scripts/test_portfolio_commands.py

      - name: Audit hardening: active alias, Golden admission and routing
        run: |
          python3 scripts/test_factory_hardening.py
          python3 scripts/test_v27_active_commands.py

      - name: Test v27C resolver, lazy routing and fail closed
        run: python3 scripts/test_v27_resolver.py

      - name: Current v27 routing and UTF-8 context measurement (offline)
        run: python3 scripts/evaluate_v27_active_routes.py

      - name: v27D read-only three-repo routing and context-byte replay
        run: python3 scripts/evaluate_v27_pilots.py

      - name: Install pinned tokenizer for v27D2 prompt comparison
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir tiktoken==0.12.0

      - name: v27D2 paired prompt protocol and tokenizer counts
        run: python3 scripts/evaluate_v27d2.py --self-test --bench --require-tokenizer

      - name: v27E release branch activation compatibility and fail-closed gates
        run: python3 scripts/test_v27_activation_shadow.py

      - name: v27D2 manual real-model runner dry-run (zero API calls)
        run: python3 scripts/run_v27d2_models.py --dry-run

      - name: v27D2 checkpoint recovery regression tests (offline mocks only)
        run: python3 scripts/test_v27d2_runner.py

      - name: Validate cumulative delivery observatory (offline, no API)
        run: |
          python3 scripts/test_v27_delivery_metrics.py
          python3 scripts/summarize_v27_delivery.py
