name: One-time Stelle command generator and validation
on:
  push:
    branches:
      - feat/stelle-capability-unified-command-20261108
    paths:
      - .github/workflows/_one_time_stelle_generator.yml
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Check factory baseline ancestry
        run: |
          git merge-base --is-ancestor 85ecbb19aeb02da1b9d04348e043f69bab77bcb9 HEAD
          test "$(git merge-base origin/main HEAD)" = "85ecbb19aeb02da1b9d04348e043f69bab77bcb9"
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r scripts/requirements.txt
      - name: Regenerate v27 full fallback and SHA integrity
        run: python3 scripts/build_v27_fallback.py --write
      - name: Regenerate public command legend
        run: python3 scripts/build_command_legend.py --write
      - name: Test generated outputs and public router
        run: |
          python3 scripts/build_v27_fallback.py --check
          python3 scripts/build_command_legend.py --check
          python3 scripts/test_command_legend.py
          python3 scripts/test_portfolio_commands.py
          python3 scripts/test_v27_resolver.py
          python3 scripts/validate_v27_candidate.py --self-test
          python3 scripts/validate_factory.py
      - name: Remove one-time generator workflow
        run: git rm .github/workflows/_one_time_stelle_generator.yml
      - name: Commit generated source of truth
        run: |
          git config user.name "app-factory-command-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build(factory): synchronize Stelle legend and v27 fallback"
          git push origin HEAD:feat/stelle-capability-unified-command-20261108
