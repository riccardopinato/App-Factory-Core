name: Language Engine — offline contract
on:
  pull_request:
    paths:
      - 'reference_engines/language_engine/**'
      - 'tests/test_language_engine.py'
      - '.github/workflows/language-engine.yml'
  push:
    branches: [main]
    paths:
      - 'reference_engines/language_engine/**'
      - 'tests/test_language_engine.py'
      - '.github/workflows/language-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Compile and run offline language contract tests
        run: |
          python3 -m py_compile reference_engines/language_engine/language_engine.py
          python3 -m unittest discover -s tests -p 'test_language_engine.py' -v
